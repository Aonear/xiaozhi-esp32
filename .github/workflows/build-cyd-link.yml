name: Build CYD Link C3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python scripts/build.py cydlink/cyd-link-c3 --name cyd-link-c3 --language id-ID --wake-word wn9s_hiesp --build-options-json '{"display_style":"default","multiline_chat":false,"wifi_provisioning":"hotspot"}'
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyd-link-c3-firmware
          path: |
            releases/**
            build/merged-binary.bin
            build/*.bin
          if-no-files-found: warn
